[project]
name = "abassurance-assureplus"
version = "1.0.0"
description = "Consolidation des bases AbAssurance (Oracle) et AssurePlus (SQL Server) et tableau de bord"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["abassurance"]
